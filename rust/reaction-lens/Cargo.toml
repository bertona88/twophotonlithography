[package]
name = "reaction-lens-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Deterministic Rust/Wasm 3D reaction-diffusion core for the Two-Photon Lithography Lab"
repository = "https://github.com/bertona88/twophotonlithography"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
